name: OnlineBGShell
options:
  bundleIdPrefix: xyx.blacg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: DBV9QXGHLB
    CODE_SIGN_STYLE: Automatic
targets:
  OnlineBGShell:
    type: application
    platform: iOS
    sources:
      - path: OnlineBGShell
    preBuildScripts:
      - name: Bundle Web
        script: |
          set -e
          SRC="$SRCROOT/../dist"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web"
          if [ ! -f "$SRC/index.html" ]; then
            echo "web build missing: run npm run build"
            exit 1
          fi
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$SRC"/. "$DEST"/
    settings:
      base:
        PRODUCT_NAME: OnlineBGShell
        PRODUCT_BUNDLE_IDENTIFIER: xyx.blacg.onlinebgclient.shell
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: OnlineBGShell/Info.plist
      properties:
        CFBundleDisplayName: OnlineBG Shell
        CFBundleShortVersionString: "0.5.0"
        CFBundleVersion: "11"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CADisableMinimumFrameDurationOnPhone: true
        NSLocalNetworkUsageDescription: 连接同一 Wi-Fi 下的牌桌服务。
        NSCameraUsageDescription: 扫描房间邀请二维码。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

name: Desktop packages
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to verify
        type: choice
        options: [all, windows, macos]
        default: all

permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  platforms:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      all-platforms: ${{ steps.select.outputs.all-platforms }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: select
        run: node scripts/ci-platforms.mjs
  package:
    needs: platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run upstream:build
      - run: npm run server:build
      - run: node scripts/release-version.mjs
      - run: npm run build
      - run: npm test
      - run: npm run hosting:build
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run verify:expedition-chapter
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: src-tauri
          cache-on-failure: true
          cache-workspace-crates: true
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib updater::tests
      - if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: codesign --verify --deep --strict src-tauri/target/release/bundle/macos/OnlineBGClient.app
      - if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/verify-update-bundle.mjs
      - if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: node scripts/build-dmg.mjs
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OnlineBGClient-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
            artifacts/release-build/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [platforms, package]
    if: ${{ needs.platforms.outputs.all-platforms == 'true' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: OnlineBGClient-*
          path: artifacts/release-input
      - run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

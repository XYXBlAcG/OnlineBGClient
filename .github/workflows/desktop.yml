name: Desktop packages
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish a preview release after verification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            name: Windows-x64
            args: --bundles nsis
          - runner: macos-14
            name: macOS-arm64
            args: --bundles app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run upstream:build
      - run: npm run server:build
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm test -- --run tests/release-assets.test.ts tests/beginner-guide.test.ts tests/trick-guide.test.ts tests/game-expansion.test.ts tests/economic-ai.test.ts tests/commands.test.ts tests/themes.test.ts tests/strategies.test.ts tests/ddz.test.ts tests/ddz-renderer.test.tsx tests/engine.test.ts tests/room-lifecycle.test.ts tests/storage.test.ts tests/replay.test.ts tests/connection.test.ts tests/room-game-switch.test.ts tests/social.test.ts tests/poison.test.ts tests/service-host.test.ts tests/snapshot-sync.test.ts tests/catan.test.ts tests/catan-transactions.test.ts tests/social-preferences.test.ts tests/ai-observation.test.ts tests/browser-compute.test.ts tests/benchmark-preferences.test.ts tests/compute.test.ts tests/audit-recording.test.ts tests/game-surface.test.tsx tests/hero-guide.test.ts tests/chat-read.test.ts tests/archive-upgrade.test.ts tests/sgs-renderer.test.tsx tests/desktop-context-menu.test.ts tests/table-layout.test.ts tests/native-windows.test.ts tests/guide-targets.test.ts tests/upstream.test.ts
      - if: startsWith(github.ref, 'refs/tags/')
        run: npm test
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: ${{ matrix.args }}
      - run: node scripts/verify-smoke-report.mjs
      - if: runner.os == 'Windows'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol --lib hosting::tests::background_process_has_no_console
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:COMPANION_SMOKE_PROFILE = "ai"
          $env:COMPANION_SMOKE_OUTPUT = Join-Path $env:RUNNER_TEMP "native-ai-result.txt"
          cargo build --release --manifest-path src-tauri/Cargo.toml --example smoke --features tauri/custom-protocol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $process = Start-Process -FilePath "src-tauri/target/release/examples/smoke.exe" -PassThru
          if (-not $process.WaitForExit(600000)) {
            $process.Kill()
            $progress = [System.IO.Path]::ChangeExtension($env:COMPANION_SMOKE_OUTPUT, "progress.log")
            if (Test-Path $progress) { Get-Content $progress }
            if (Test-Path $env:COMPANION_SMOKE_OUTPUT) { Get-Content $env:COMPANION_SMOKE_OUTPUT }
            throw "Native AI verification timed out"
          }
          if (-not (Test-Path $env:COMPANION_SMOKE_OUTPUT)) { throw "Native AI verification did not report" }
          $result = Get-Content $env:COMPANION_SMOKE_OUTPUT -Raw
          Write-Output $result
          if (-not $result.StartsWith("PASS")) {
            $progress = [System.IO.Path]::ChangeExtension($env:COMPANION_SMOKE_OUTPUT, "progress.log")
            if (Test-Path $progress) { Get-Content $progress }
            throw "Native AI verification failed"
          }
      - run: npx playwright install chromium
      - run: npm run verify:smoke
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Smoke-diagnostics-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/native-ai-result.txt
            ${{ runner.temp }}/native-ai-result.progress.log
            .tmp/smoke/results.json
          if-no-files-found: ignore
          retention-days: 7
      - if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/OnlineBGClient.app OnlineBGClient-macOS-arm64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OnlineBGClient-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            OnlineBGClient-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14
  release:
    needs: package
    if: ${{ github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch' && inputs.publish_preview && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: OnlineBGClient-*
          path: artifacts/release-input
      - run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

name: Desktop packages
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            name: Windows-x64
            args: --bundles nsis
          - runner: macos-14
            name: macOS-arm64
            args: --bundles app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run upstream:build
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm test -- --run tests/commands.test.ts tests/themes.test.ts tests/strategies.test.ts tests/ddz.test.ts tests/ddz-renderer.test.tsx tests/engine.test.ts tests/room-lifecycle.test.ts tests/storage.test.ts tests/replay.test.ts tests/connection.test.ts tests/room-game-switch.test.ts tests/social.test.ts tests/assets.test.ts tests/hero-guide.test.ts tests/chat-read.test.ts tests/archive-upgrade.test.ts tests/sgs-renderer.test.tsx tests/desktop-context-menu.test.ts
      - if: startsWith(github.ref, 'refs/tags/')
        run: npm test
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: ${{ matrix.args }}
      - if: runner.os == 'Windows'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol --lib hosting::tests::background_process_has_no_console
      - run: npm run server:build
      - run: npx playwright install chromium
      - run: node scripts/verify-restart.mjs
      - run: node scripts/verify-client.mjs
      - run: node scripts/verify-social.mjs
      - if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/OnlineBGClient.app OnlineBGClient-macOS-arm64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OnlineBGClient-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            OnlineBGClient-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14

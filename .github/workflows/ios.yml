name: iOS IPA

on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios
      - run: rustup target add aarch64-apple-ios
      - run: rustup component add llvm-tools
      - run: brew install xcodegen
      - run: npm ci
      - run: mkdir -p src-tauri/resources/hosting
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: ios-swiftpm-livekit-2.19.0-v1
          restore-keys: |
            ios-swiftpm-livekit-
      - name: Build unsigned IPA
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if npx tauri ios build --no-sign --ci --target aarch64 --export-method debugging 2>&1 | tee /tmp/ios-build.log; then
              exit 0
            fi
            if grep -q "badResponseStatusCode(504)" /tmp/ios-build.log; then
              sleep 20
              continue
            fi
            exit 1
          done
          exit 1
      - name: Collect unsigned IPA
        run: |
          IPA=$(find src-tauri/gen/apple src-tauri/target -name '*.ipa' -type f | head -1)
          test -n "$IPA"
          cp "$IPA" OnlineBGClient-unsigned.ipa
      - name: Verify voice plugin export
        run: |
          rm -rf /tmp/onlinebg-ipa-check
          unzip -q OnlineBGClient-unsigned.ipa -d /tmp/onlinebg-ipa-check
          if ! nm -gU /tmp/onlinebg-ipa-check/Payload/OnlineBGClient.app/OnlineBGClient | grep -q _init_plugin_voice_native; then
            xcrun dyld_info -exports /tmp/onlinebg-ipa-check/Payload/OnlineBGClient.app/OnlineBGClient | grep _init_plugin_voice_native
          fi
          test -d /tmp/onlinebg-ipa-check/Payload/OnlineBGClient.app/Frameworks/LiveKitWebRTC.framework
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OnlineBGClient-unsigned-ipa
          path: OnlineBGClient-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" OnlineBGClient-unsigned.ipa --clobber

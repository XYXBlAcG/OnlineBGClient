[package]
name = "tauri-plugin-voice-native"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-voice-native"
description = "Native iOS voice transport for OnlineBGClient"

[lib]
name = "tauri_plugin_voice_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", features = ["wry"] }
